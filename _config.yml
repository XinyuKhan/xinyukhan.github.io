archive_dir: archives
author: Xinyu Han
category_dir: categories
category_map: null
code_dir: downloads/code
date_format: YYYY-MM-DD
default_category: uncategorized
default_layout: post
deploy:
  branch: main
  repo: https://github.com/XinyuKhan/xinyukhan.github.io.git
  type: git
description: "Xinyu Han 的技术博客，专注于最优控制、轨迹优化、强化学习、卡尔曼滤波、iLQR、LQR、MPC、Drake 等方向的理论推导与工程实现。A technical blog on optimal control, trajectory optimization, reinforcement learning, state estimation and robotics."
subtitle: "控制理论 · 轨迹优化 · 强化学习 · 状态估计"
exclude: null
external_link:
  enable: true
  exclude: ''
  field: site
filename_case: 0
future: true
highlight:
  auto_detect: false
  hljs: false
  line_number: true
  tab_replace: ''
  wrap: true
i18n_dir: :lang
ignore: null
include: null
index_generator:
  order_by: -date
  path: ''
  per_page: 10
keywords: "iLQR,LQR,MPC,最优控制,轨迹优化,强化学习,Drake,卡尔曼滤波,B-Spline,状态估计,机器人控制,动态规划,Bellman方程,策略梯度,Actor-Critic,optimal control,trajectory optimization,reinforcement learning,robotics"
language: en


mathjax:
  tags: none
  single_dollars: true
  cjk_width: 0.9
  normal_width: 0.6
  append_css: true
  every_page: true

# Settings recovered safely
title: "Xinyu Han's Blog"
url: https://xinyukhan.github.io
permalink: :year/:month/:day/:title/
theme: fluid

markdown:
  render:
    html: true
    breaks: true
    linkify: true
    typographer: true
  plugins:
    - "@iktakahiro/markdown-it-katex"

# --- SEO ---
# 站点地图（需要 `npm install --save hexo-generator-sitemap`）
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# RSS 订阅（需要 `npm install --save hexo-generator-feed`）
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 240
  content_limit_delim: ' '
  order_by: -date

